apiVersion: v1
kind: Namespace
metadata:
  name: jev-gateway
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jev-gateway-config
  namespace: jev-gateway
data:
  JEV_BIND_HOST: "0.0.0.0"
  JEV_SMALL_URL: "http://host.docker.internal:11434/v1"
  JEV_MEDIUM_URL: "http://host.docker.internal:11434/v1"
  JEV_ROUTER_POLICY: "always-small"
  JEV_AVAILABILITY_FAILOVER_ENABLED: "false"
  JEV_MAX_ACTIVE_REQUESTS: "4"
  JEV_MAX_QUEUED_REQUESTS: "8"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jev-gateway
  namespace: jev-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jev-gateway
  template:
    metadata:
      labels:
        app: jev-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: gateway
          image: jev-gateway:day5
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: jev-gateway-config
            - secretRef:
                name: jev-gateway-credentials
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: jev-gateway
  namespace: jev-gateway
spec:
  type: ClusterIP
  selector:
    app: jev-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
