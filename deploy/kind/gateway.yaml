apiVersion: v1
kind: Namespace
metadata:
  name: laya-gateway
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: laya-gateway-config
  namespace: laya-gateway
data:
  LAYA_GATEWAY_BIND_HOST: "0.0.0.0"
  LAYA_GATEWAY_SMALL_URL: "http://host.docker.internal:11434/v1"
  LAYA_GATEWAY_MEDIUM_URL: "http://host.docker.internal:11434/v1"
  LAYA_GATEWAY_ROUTER_POLICY: "always-small"
  LAYA_GATEWAY_CACHE_PATH: ""
  LAYA_GATEWAY_EXECUTION_PAID_ENABLED: "false"
  LAYA_GATEWAY_AVAILABILITY_FAILOVER_ENABLED: "false"
  LAYA_GATEWAY_MAX_ACTIVE_REQUESTS: "4"
  LAYA_GATEWAY_MAX_QUEUED_REQUESTS: "8"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laya-gateway
  namespace: laya-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: laya-gateway
  template:
    metadata:
      labels:
        app: laya-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: gateway
          image: laya-gateway:day5
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: laya-gateway-config
            - secretRef:
                name: laya-gateway-credentials
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: laya-gateway
  namespace: laya-gateway
spec:
  type: ClusterIP
  selector:
    app: laya-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
