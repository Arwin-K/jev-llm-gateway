groups:
  - name: jev-gateway
    interval: 30s
    rules:
      - record: jev:request_rate5m
        expr: sum(rate(jev_client_requests_total[5m]))
      - record: jev:request_error_rate5m
        expr: sum(rate(jev_client_requests_total{status!~"2.."}[5m]))
      - record: jev:request_p95_seconds5m
        expr: histogram_quantile(0.95, sum by (le) (rate(jev_request_duration_seconds_bucket[5m])))
      - record: jev:request_p50_seconds5m
        expr: histogram_quantile(0.50, sum by (le) (rate(jev_request_duration_seconds_bucket[5m])))
