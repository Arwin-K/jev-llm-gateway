name: Offline regression
on:
  push:
  pull_request:
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Install locked core and tests
        run: make setup-test
      - name: Syntax and focused lint checks
        run: |
          make compile
          git diff --check
          uvx ruff@0.14.0 check --select E4,E9,F src/laya_gateway tests load scripts
      - name: Offline regression suite
        run: make test
      - name: Build package
        run: make build
