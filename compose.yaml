name: jev-gateway
services:
  gateway:
    build: .
    image: jev-gateway:day5
    init: true
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      JEV_BIND_HOST: 0.0.0.0
      JEV_SMALL_URL: http://host.docker.internal:11434/v1
      JEV_MEDIUM_URL: http://host.docker.internal:11434/v1
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/readyz', timeout=2).close()"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.9.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/jev-rules.yml:/etc/prometheus/jev-rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
volumes:
  prometheus-data:
  grafana-data:
