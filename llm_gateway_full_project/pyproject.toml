[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "jev-gateway"
version = "0.1.0"
description = "Three-tier text chat gateway for the full Jev project"
requires-python = ">=3.11,<3.15"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.27,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "anyio>=4,<5"]
colab = []
training = ["transformers>=4.50,<5", "datasets>=3,<5", "accelerate>=1,<2", "torch>=2.6,<3"]
embeddings = ["sentence-transformers>=3,<6", "faiss-cpu>=1.9,<2"]

[project.scripts]
jev = "jev_gateway.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
