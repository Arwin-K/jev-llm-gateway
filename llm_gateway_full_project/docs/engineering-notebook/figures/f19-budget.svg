<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" height="270"><defs><marker id="ah-a8512a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#a8512a"/></marker><marker id="ah-5c7a5c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#5c7a5c"/></marker><marker id="ah-55697d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#55697d"/></marker><marker id="ah-a24b36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#a24b36"/></marker><marker id="ah-b08532" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#b08532"/></marker><marker id="ah-8a6a48" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#8a6a48"/></marker><marker id="ah-6d5a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#6d5a7a"/></marker><marker id="ah-5a4e44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#5a4e44"/></marker><marker id="ah-6f665c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#6f665c"/></marker></defs><rect x="16" y="30" width="170" height="70" rx="7" fill="#ffffff" stroke="#b3a491" stroke-width="1.3"/><text x="101.0" y="56.846" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="600" fill="#2f2a25"><tspan x="101.0" dy="0.0">Message text</tspan></text><text x="101.0" y="68.67999999999999" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.7" text-anchor="middle" font-weight="400" fill="#6f665c"><tspan x="101.0" dy="0.0">4 units per character</tspan></text><text x="101.0" y="80.514" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.7" text-anchor="middle" font-weight="400" fill="#6f665c"><tspan x="101.0" dy="0.0">+ 32 per message</tspan></text><rect x="16" y="120" width="170" height="56" rx="7" fill="#ffffff" stroke="#b3a491" stroke-width="1.3"/><text x="101.0" y="145.763" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="600" fill="#2f2a25"><tspan x="101.0" dy="0.0">max_tokens</tspan></text><text x="101.0" y="157.597" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.7" text-anchor="middle" font-weight="400" fill="#6f665c"><tspan x="101.0" dy="0.0">requested output</tspan></text><rect x="226" y="60" width="196" height="86" rx="7" fill="#f6e2d4" stroke="#a8512a" stroke-width="1.3"/><text x="324.0" y="88.929" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="600" fill="#2f2a25"><tspan x="324.0" dy="0.0">Conservative estimate</tspan></text><text x="324.0" y="100.763" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.7" text-anchor="middle" font-weight="400" fill="#6f665c"><tspan x="324.0" dy="0.0">tokens = input + output</tspan></text><text x="324.0" y="112.59700000000001" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.7" text-anchor="middle" font-weight="400" fill="#6f665c"><tspan x="324.0" dy="0.0">usd = in×rate_in + out×rate_out</tspan></text><text x="324.0" y="124.43100000000001" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.7" text-anchor="middle" font-weight="400" fill="#6f665c"><tspan x="324.0" dy="0.0">÷ 1,000,000</tspan></text><path d="M186,65 L224,90" fill="none" stroke="#5a4e44" stroke-width="1.4" marker-end="url(#ah-5a4e44)"/><path d="M186,148 L224,124" fill="none" stroke="#5a4e44" stroke-width="1.4" marker-end="url(#ah-5a4e44)"/><rect x="462" y="30" width="242" height="116" rx="7" fill="#f4ecdf" stroke="#8a6a48" stroke-width="1.3"/><text x="583.0" y="73.929" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="600" fill="#2f2a25"><tspan x="583.0" dy="0.0">Under one asyncio.Lock</tspan></text><text x="583.0" y="85.763" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.7" text-anchor="middle" font-weight="400" fill="#6f665c"><tspan x="583.0" dy="0.0">requests + 1 ≤ MAX_REQUESTS</tspan></text><text x="583.0" y="97.59700000000001" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.7" text-anchor="middle" font-weight="400" fill="#6f665c"><tspan x="583.0" dy="0.0">tokens ≤ MAX_TOKENS</tspan></text><text x="583.0" y="109.43100000000001" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.7" text-anchor="middle" font-weight="400" fill="#6f665c"><tspan x="583.0" dy="0.0">usd ≤ MAX_USD</tspan></text><path d="M422,103 L460,92" fill="none" stroke="#5a4e44" stroke-width="1.4" marker-end="url(#ah-5a4e44)"/><rect x="462" y="170" width="112" height="46" rx="7" fill="#e4eee2" stroke="#5c7a5c" stroke-width="1.3"/><text x="518.0" y="190.763" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="600" fill="#2f2a25"><tspan x="518.0" dy="0.0">Admit</tspan></text><text x="518.0" y="202.597" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.7" text-anchor="middle" font-weight="400" fill="#6f665c"><tspan x="518.0" dy="0.0">counters grow</tspan></text><rect x="592" y="170" width="112" height="46" rx="7" fill="#f5dfd8" stroke="#a24b36" stroke-width="1.3"/><text x="648.0" y="190.763" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="600" fill="#2f2a25"><tspan x="648.0" dy="0.0">Reject</tspan></text><text x="648.0" y="202.597" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.7" text-anchor="middle" font-weight="400" fill="#6f665c"><tspan x="648.0" dy="0.0">HTTP 429</tspan></text><path d="M540,146 L520,168" fill="none" stroke="#5c7a5c" stroke-width="1.4" marker-end="url(#ah-5c7a5c)"/><path d="M626,146 L646,168" fill="none" stroke="#a24b36" stroke-width="1.4" marker-end="url(#ah-a24b36)"/><text x="16" y="232" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="400" fill="#6f665c" font-style="italic"><tspan x="16" dy="0.0">Reservations are never released, so counts only rise within a process. The guard is per-process and</tspan><tspan x="16" dy="13.1">approximate; it complements, and does not replace, spending limits in the provider&#x27;s account.</tspan></text></svg>
