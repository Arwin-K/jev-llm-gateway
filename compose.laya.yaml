services:
  gateway:
    environment:
      JEV_DECISION_URL: http://laya:8000
      JEV_DECISION_ALLOW_COMPOSE_SERVICE: "true"
    depends_on:
      laya:
        condition: service_healthy
  laya:
    build:
      context: .
      dockerfile: Dockerfile.laya
    image: jev-gateway-laya:0.5.2
    init: true
    environment:
      HF_HOME: /model-cache
      LAYA_HOST: 0.0.0.0
      LAYA_PORT: "8000"
      LAYA_DEVICE: cpu
      LAYA_MODELS: typed-decisions
      LAYA_PRELOAD: "1"
      LAYA_REVISION: reviewed
    volumes:
      - laya-model-cache:/model-cache
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3
    restart: unless-stopped
volumes:
  laya-model-cache:
