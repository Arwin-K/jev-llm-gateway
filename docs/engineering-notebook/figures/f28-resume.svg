<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 226" width="720" height="226"><defs><marker id="ah-a8512a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#a8512a"/></marker><marker id="ah-5c7a5c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#5c7a5c"/></marker><marker id="ah-55697d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#55697d"/></marker><marker id="ah-a24b36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#a24b36"/></marker><marker id="ah-b08532" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#b08532"/></marker><marker id="ah-8a6a48" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#8a6a48"/></marker><marker id="ah-6d5a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#6d5a7a"/></marker><marker id="ah-5a4e44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#5a4e44"/></marker><marker id="ah-6f665c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#6f665c"/></marker></defs><rect x="16" y="24" width="220" height="108" rx="7" fill="#ffffff" stroke="#b3a491" stroke-width="1.3"/><text x="126.0" y="58.012" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="600" fill="#2f2a25"><tspan x="126.0" dy="0.0">Fingerprint</tspan></text><text x="126.0" y="69.846" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.7" text-anchor="middle" font-weight="400" fill="#6f665c"><tspan x="126.0" dy="0.0">prompt id + text hash</tspan></text><text x="126.0" y="81.68" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.7" text-anchor="middle" font-weight="400" fill="#6f665c"><tspan x="126.0" dy="0.0">tier + model revision</tspan></text><text x="126.0" y="93.51400000000001" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.7" text-anchor="middle" font-weight="400" fill="#6f665c"><tspan x="126.0" dy="0.0">generation settings</tspan></text><text x="126.0" y="105.34800000000001" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.7" text-anchor="middle" font-weight="400" fill="#6f665c"><tspan x="126.0" dy="0.0">template version</tspan></text><rect x="272" y="40" width="140" height="76" rx="7" fill="#f4ecdf" stroke="#8a6a48" stroke-width="1.3"/><text x="342.0" y="69.846" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="600" fill="#2f2a25"><tspan x="342.0" dy="0.0">Seen in</tspan></text><text x="342.0" y="81.68" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.7" text-anchor="middle" font-weight="400" fill="#6f665c"><tspan x="342.0" dy="0.0">completed</tspan></text><text x="342.0" y="93.51400000000001" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.7" text-anchor="middle" font-weight="400" fill="#6f665c"><tspan x="342.0" dy="0.0">records?</tspan></text><path d="M236,78 L270,78" fill="none" stroke="#5a4e44" stroke-width="1.4" marker-end="url(#ah-5a4e44)"/><rect x="452" y="14" width="252" height="52" rx="7" fill="#e4eee2" stroke="#5c7a5c" stroke-width="1.3"/><text x="578.0" y="37.763" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="600" fill="#2f2a25"><tspan x="578.0" dy="0.0">Yes → skip</tspan></text><text x="578.0" y="49.596999999999994" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.7" text-anchor="middle" font-weight="400" fill="#6f665c"><tspan x="578.0" dy="0.0">reuse; keep original run id + time</tspan></text><rect x="452" y="90" width="252" height="52" rx="7" fill="#f8ecd2" stroke="#b08532" stroke-width="1.3"/><text x="578.0" y="113.763" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="600" fill="#2f2a25"><tspan x="578.0" dy="0.0">No → call backend</tspan></text><text x="578.0" y="125.59700000000001" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.7" text-anchor="middle" font-weight="400" fill="#6f665c"><tspan x="578.0" dy="0.0">append one record, then flush</tspan></text><path d="M412,66 L450,42" fill="none" stroke="#5c7a5c" stroke-width="1.4" marker-end="url(#ah-5c7a5c)"/><path d="M412,90 L450,114" fill="none" stroke="#b08532" stroke-width="1.4" marker-end="url(#ah-b08532)"/><text x="16" y="176" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="400" fill="#6f665c" font-style="italic"><tspan x="16" dy="0.0">An interrupted run leaves complete lines plus at most one partial line. On resume, the partial line</tspan><tspan x="16" dy="13.1">is discarded, completed fingerprints are skipped, and only missing work is sent.</tspan><tspan x="16" dy="13.1">Changing any fingerprint field (e.g. a new model revision) makes a new experiment, not a resume.</tspan></text></svg>
