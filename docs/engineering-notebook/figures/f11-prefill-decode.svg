f" font-size="11" text-anchor="middle" font-weight="600" fill="#2f2a25"><tspan x="413.0" dy="0.0">step 3</tspan></text><text x="413.0" y="80.132" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.2" text-anchor="middle" font-weight="400" fill="#6f665c"><tspan x="413.0" dy="0.0">1 token</tspan></text><rect x="454" y="42" width="62" height="58" rx="7" fill="#f4ecdf" stroke="#8a6a48" stroke-width="1.3"/><text x="485.0" y="68.908" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="600" fill="#2f2a25"><tspan x="485.0" dy="0.0">step 4</tspan></text><text x="485.0" y="80.132" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.2" text-anchor="middle" font-weight="400" fill="#6f665c"><tspan x="485.0" dy="0.0">1 token</tspan></text><rect x="526" y="42" width="62" height="58" rx="7" fill="#f4ecdf" stroke="#8a6a48" stroke-width="1.3"/><text x="557.0" y="68.908" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="600" fill="#2f2a25"><tspan x="557.0" dy="0.0">step 5</tspan></text><text x="557.0" y="80.132" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.2" text-anchor="middle" font-weight="400" fill="#6f665c"><tspan x="557.0" dy="0.0">1 token</tspan></text><rect x="598" y="42" width="62" height="58" rx="7" fill="#f4ecdf" stroke="#8a6a48" stroke-width="1.3"/><text x="629.0" y="68.908" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="600" fill="#2f2a25"><tspan x="629.0" dy="0.0">step 6</tspan></text><text x="629.0" y="80.132" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.2" text-anchor="middle" font-weight="400" fill="#6f665c"><tspan x="629.0" dy="0.0">1 token</tspan></text><text x="682" y="76" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#6f665c"><tspan x="682" dy="0.0">…</tspan></text><path d="M16,116 L226,116" fill="none" stroke="#a8512a" stroke-width="2"/><text x="121" y="132" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" font-weight="600" fill="#a8512a"><tspan x="121" dy="0.0">≈ time to first token</tspan></text><path d="M238,116 L692,116" fill="none" stroke="#8a6a48" stroke-width="2"/><text x="465" y="132" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" font-weight="600" fill="#8a6a48"><tspan x="465" dy="0.0">decode: one forward pass per new token, sequential</tspan></text><text x="16" y="168" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="600" fill="#2f2a25"><tspan x="16" dy="0.0">KV cache (keys and values kept for every token seen so far)</tspan></text><rect x="16" y="180" width="210" height="9" rx="2" fill="#f6e2d4" stroke="#a8512a" stroke-width="0.8"/><text x="234" y="188" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" text-anchor="start" font-weight="400" fill="#6f665c"><tspan x="234" dy="0.0">after prefill</tspan></text><rect x="16" y="192" width="222" height="9" rx="2" fill="#ffffff" stroke="#b3a491" stroke-width="0.8"/><text x="246" y="200" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" text-anchor="start" font-weight="400" fill="#6f665c"><tspan x="246" dy="0.0">+1 token</tspan></text><rect x="16" y="204" width="234" height="9" rx="2" fill="#ffffff" stroke="#b3a491" stroke-width="0.8"/><text x="258" y="212" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" text-anchor="start" font-weight="400" fill="#6f665c"><tspan x="258" dy="0.0">+2 tokens</tspan></text><rect x="16" y="216" width="246" height="9" rx="2" fill="#ffffff" stroke="#b3a491" stroke-width="0.8"/><text x="270" y="224" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" text-anchor="start" font-weight="400" fill="#6f665c"><tspan x="270" dy="0.0">+3 tokens</tspan></text><rect x="16" y="228" width="258" height="9" rx="2" fill="#ffffff" stroke="#b3a491" stroke-width="0.8"/><text x="282" y="236" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" text-anchor="start" font-weight="400" fill="#6f665c"><tspan x="282" dy="0.0">+4 tokens</tspan></text><rect x="16" y="240" width="270" height="9" rx="2" fill="#ffffff" stroke="#b3a491" stroke-width="0.8"/><text x="294" y="248" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" text-anchor="start" font-weight="400" fill="#6f665c"><tspan x="294" dy="0.0">+5 tokens</tspan></text><rect x="16" y="252" width="282" height="9" rx="2" fill="#ffffff" stroke="#b3a491" stroke-width="0.8"/><text x="306" y="260" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" text-anchor="start" font-weight="400" fill="#6f665c"><tspan x="306" dy="0.0">+6 tokens</tspan></text><text x="380" y="188" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="400" fill="#2f2a25"><tspan x="380" dy="0.0">Prefill is mostly compute-bound: many tokens</tspan><tspan x="380" dy="13.8">share each weight read.</tspan><tspan x="380" dy="13.8">Decode is often memory-bandwidth-bound: every</tspan><tspan x="380" dy="13.8">step re-reads weights and the growing cache</tspan><tspan x="380" dy="13.8">to produce a single token.</tspan></text></svg>
