<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300"><defs><marker id="ah-a8512a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#a8512a"/></marker><marker id="ah-5c7a5c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#5c7a5c"/></marker><marker id="ah-55697d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#55697d"/></marker><marker id="ah-a24b36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#a24b36"/></marker><marker id="ah-b08532" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#b08532"/></marker><marker id="ah-8a6a48" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#8a6a48"/></marker><marker id="ah-6d5a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#6d5a7a"/></marker><marker id="ah-5a4e44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#5a4e44"/></marker><marker id="ah-6f665c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#6f665c"/></marker></defs><rect x="12" y="12" width="336" height="244" rx="10" fill="#ffffff" stroke="#b3a491" stroke-width="1.3"/><text x="180" y="36" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="600" fill="#2f2a25"><tspan x="180" dy="0.0">Tier-choice confidence (Choice)</tspan></text><rect x="372" y="12" width="336" height="244" rx="10" fill="#ffffff" stroke="#b3a491" stroke-width="1.3"/><text x="540" y="36" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="600" fill="#2f2a25"><tspan x="540" dy="0.0">Probability of a defined event (Noul)</tspan></text><rect x="52" y="164.5" width="52" height="25.5" rx="3" fill="#ffffff" stroke="#b3a491" stroke-width="1.3"/><text x="78" y="206" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" font-weight="400" fill="#2f2a25"><tspan x="78" dy="0.0">small</tspan></text><text x="78" y="158.5" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" font-weight="600" fill="#2f2a25"><tspan x="78" dy="0.0">0.15</tspan></text><rect x="142" y="71.00000000000001" width="52" height="118.99999999999999" rx="3" fill="#f6e2d4" stroke="#a8512a" stroke-width="1.3"/><text x="168" y="206" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" font-weight="400" fill="#2f2a25"><tspan x="168" dy="0.0">medium</tspan></text><text x="168" y="65.00000000000001" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" font-weight="600" fill="#2f2a25"><tspan x="168" dy="0.0">0.70</tspan></text><rect x="232" y="164.5" width="52" height="25.5" rx="3" fill="#ffffff" stroke="#b3a491" stroke-width="1.3"/><text x="258" y="206" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" font-weight="400" fill="#2f2a25"><tspan x="258" dy="0.0">frontier</tspan></text><text x="258" y="158.5" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" font-weight="600" fill="#2f2a25"><tspan x="258" dy="0.0">0.15</tspan></text><text x="30" y="228" font-family="Menlo, SF Mono, monospace" font-size="10.5" text-anchor="start" font-weight="400" fill="#2f2a25"><tspan x="30" dy="0.0">confidence = (0.70 − 1/3) / (1 − 1/3) = 0.55</tspan></text><text x="30" y="246" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="400" fill="#6f665c" font-style="italic"><tspan x="30" dy="0.0">Event: none defined — a preference spread</tspan></text><rect x="412" y="70" width="256" height="26" rx="4" fill="#ffffff" stroke="#b3a491" stroke-width="1.3"/><rect x="412" y="70" width="158.72" height="26" rx="4" fill="#f6e2d4" stroke="#a8512a" stroke-width="1.3"/><text x="420" y="88" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="600" fill="#2f2a25"><tspan x="420" dy="0.0">noul = 0.62</tspan></text><text x="392" y="124" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="400" fill="#2f2a25"><tspan x="392" dy="0.0">Event: “the small tier&#x27;s answer to this</tspan><tspan x="392" dy="13.8">prompt passes the Day 2 scorer”</tspan><tspan x="392" dy="13.8">&#160;</tspan><tspan x="392" dy="13.8">Checked against observed outcomes:</tspan><tspan x="392" dy="13.8">of all prompts given ≈0.6, about 60%</tspan><tspan x="392" dy="13.8">should pass — if calibrated.</tspan></text><text x="392" y="246" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="400" fill="#6f665c" font-style="italic"><tspan x="392" dy="0.0">Needs labels from real evaluation runs</tspan></text><text x="12" y="286" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="400" fill="#6f665c" font-style="italic"><tspan x="12" dy="0.0">A confident tier choice is not a probability that the chosen tier&#x27;s answer will be correct. Only the right panel names an event that can be scored.</tspan></text></svg>
