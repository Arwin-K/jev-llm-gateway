 y2="74.0" stroke="#ece4d8"/><text x="278.0" y="265" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" text-anchor="middle" font-weight="400" fill="#6f665c"><tspan x="278.0" dy="0.0">0.8</tspan></text><text x="64" y="77.0" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" text-anchor="end" font-weight="400" fill="#6f665c"><tspan x="64" dy="0.0">0.8</tspan></text><line x1="330.0" y1="250" x2="330.0" y2="30" stroke="#ece4d8"/><line x1="70" y1="30.0" x2="330" y2="30.0" stroke="#ece4d8"/><text x="330.0" y="265" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" text-anchor="middle" font-weight="400" fill="#6f665c"><tspan x="330.0" dy="0.0">1.0</tspan></text><text x="64" y="33.0" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" text-anchor="end" font-weight="400" fill="#6f665c"><tspan x="64" dy="0.0">1.0</tspan></text><line x1="70" y1="250" x2="330" y2="30" stroke="#6f665c" stroke-dasharray="4 3"/><circle cx="83.0" cy="245.6" r="4.333333333333333" fill="#a8512a" stroke="#ffffff" stroke-width="1.2"/><circle cx="109.0" cy="230.2" r="4.833333333333333" fill="#a8512a" stroke="#ffffff" stroke-width="1.2"/><circle cx="135.0" cy="210.4" r="5.0" fill="#a8512a" stroke="#ffffff" stroke-width="1.2"/><circle cx="161.0" cy="190.6" r="5.333333333333334" fill="#a8512a" stroke="#ffffff" stroke-width="1.2"/><circle cx="187.0" cy="162.0" r="5.666666666666666" fill="#a8512a" stroke="#ffffff" stroke-width="1.2"/><circle cx="213.0" cy="148.8" r="6.0" fill="#a8512a" stroke="#ffffff" stroke-width="1.2"/><circle cx="239.0" cy="129.0" r="5.833333333333334" fill="#a8512a" stroke="#ffffff" stroke-width="1.2"/><circle cx="265.0" cy="111.4" r="5.333333333333334" fill="#a8512a" stroke="#ffffff" stroke-width="1.2"/><circle cx="291.0" cy="87.19999999999999" r="5.0" fill="#a8512a" stroke="#ffffff" stroke-width="1.2"/><circle cx="317.0" cy="60.80000000000001" r="4.666666666666667" fill="#a8512a" stroke="#ffffff" stroke-width="1.2"/><text x="200.0" y="284" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" font-weight="400" fill="#2f2a25"><tspan x="200.0" dy="0.0">mean predicted probability in bin</tspan></text><text x="22" y="140.0" transform="rotate(-90 22 140.0)" font-family="Avenir Next" font-size="10.5" text-anchor="middle" fill="#2f2a25">observed frequency of the event</text><text x="380" y="54" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="600" fill="#a8512a"><tspan x="380" dy="0.0">Synthetic points — no project data</tspan></text><text x="380" y="80" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="400" fill="#2f2a25"><tspan x="380" dy="0.0">Each dot is one probability bin; dot size is</tspan><tspan x="380" dy="13.8">the number of predictions in it.</tspan><tspan x="380" dy="13.8">&#160;</tspan><tspan x="380" dy="13.8">Points below the dashed diagonal mean</tspan><tspan x="380" dy="13.8">the predictions were overconfident.</tspan><tspan x="380" dy="13.8">&#160;</tspan><tspan x="380" dy="13.8">ECE = Σ (n_b / N) · |acc(b) − conf(b)|</tspan><tspan x="380" dy="13.8">&#160;</tspan><tspan x="380" dy="13.8">Requires: a defined event, many scored</tspan><tspan x="380" dy="13.8">predictions, and a split not used for tuning.</tspan></text></svg>
