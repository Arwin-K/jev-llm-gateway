ank: 19th)</tspan></text><line x1="145.625" y1="72" x2="145.625" y2="134" stroke="#55697d" stroke-dasharray="2 3"/><text x="149.625" y="76" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="600" fill="#55697d"><tspan x="149.625" dy="0.0">mean = 611 ms</tspan></text><text x="16" y="182" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="400" fill="#2f2a25"><tspan x="16" dy="0.0">One 1,650 ms outlier pulls the mean up; the median ignores it. With 20 samples, p95 rests on one</tspan><tspan x="16" dy="13.1">request, so report the sample count and the percentile method with every tail number.</tspan></text></svg>
