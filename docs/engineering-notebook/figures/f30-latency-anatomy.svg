<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250"><defs><marker id="ah-a8512a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#a8512a"/></marker><marker id="ah-5c7a5c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#5c7a5c"/></marker><marker id="ah-55697d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#55697d"/></marker><marker id="ah-a24b36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#a24b36"/></marker><marker id="ah-b08532" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#b08532"/></marker><marker id="ah-8a6a48" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#8a6a48"/></marker><marker id="ah-6d5a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#6d5a7a"/></marker><marker id="ah-5a4e44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#5a4e44"/></marker><marker id="ah-6f665c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#6f665c"/></marker></defs><text x="16" y="22" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="600" fill="#2f2a25"><tspan x="16" dy="0.0">Client-side timeline of one streamed request (illustrative)</tspan></text><line x1="40" y1="110" x2="700" y2="110" stroke="#5a4e44" stroke-width="1.4"/><line x1="40" y1="102" x2="40" y2="118" stroke="#5a4e44" stroke-width="1.4"/><text x="40" y="136" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" font-weight="600" fill="#2f2a25"><tspan x="40" dy="0.0">t0 send</tspan></text><line x1="250" y1="102" x2="250" y2="118" stroke="#5a4e44" stroke-width="1.4"/><text x="250" y="136" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" font-weight="600" fill="#2f2a25"><tspan x="250" dy="0.0">first event</tspan></text><line x1="330" y1="102" x2="330" y2="118" stroke="#5a4e44" stroke-width="1.4"/><line x1="380" y1="102" x2="380" y2="118" stroke="#5a4e44" stroke-width="1.4"/><line x1="470" y1="102" x2="470" y2="118" stroke="#5a4e44" stroke-width="1.4"/><line x1="530" y1="102" x2="530" y2="118" stroke="#5a4e44" stroke-width="1.4"/><line x1="660" y1="102" x2="660" y2="118" stroke="#5a4e44" stroke-width="1.4"/><text x="660" y="136" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" font-weight="600" fill="#2f2a25"><tspan x="660" dy="0.0">[DONE]</tspan></text><rect x="240" y="78" width="20" height="18" rx="3" fill="#f4ecdf" stroke="#8a6a48" stroke-width="1.3"/><rect x="320" y="78" width="20" height="18" rx="3" fill="#f4ecdf" stroke="#8a6a48" stroke-width="1.3"/><rect x="370" y="78" width="20" height="18" rx="3" fill="#f4ecdf" stroke="#8a6a48" stroke-width="1.3"/><rect x="460" y="78" width="20" height="18" rx="3" fill="#f4ecdf" stroke="#8a6a48" stroke-width="1.3"/><rect x="520" y="78" width="20" height="18" rx="3" fill="#f4ecdf" stroke="#8a6a48" stroke-width="1.3"/><path d="M40,60 L250,60" fill="none" stroke="#a8512a" stroke-width="1.4" marker-end="url(#ah-a8512a)" marker-start="url(#ah-a8512a)"/><text x="145" y="52" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" font-weight="600" fill="#a8512a"><tspan x="145" dy="0.0">time to first visible output</tspan></text><path d="M40,170 L660,170" fill="none" stroke="#2f2a25" stroke-width="1.4" marker-end="url(#ah-2f2a25)" marker-start="url(#ah-2f2a25)"/><text x="350" y="188" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" font-weight="600" fill="#2f2a25"><tspan x="350" dy="0.0">end-to-end latency</tspan></text><path d="M330,150 L380,150" fill="none" stroke="#55697d" stroke-width="1.4" marker-end="url(#ah-55697d)" marker-start="url(#ah-55697d)"/><text x="355" y="145" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" text-anchor="middle" font-weight="600" fill="#55697d"><tspan x="355" dy="0.0">event gap</tspan></text><text x="16" y="222" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" font-weight="400" fill="#6f665c" font-style="italic"><tspan x="16" dy="0.0">An event may carry one token, several, or none (role, usage, [DONE]). Event gaps are only token timings</tspan><tspan x="16" dy="13.1">when the interface guarantees one token per event — otherwise use token counts from usage.</tspan></text></svg>
